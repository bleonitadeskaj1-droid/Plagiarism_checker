# Cloud-ready stack for Plagiarism Checker (optional)
# Usage: docker compose up -d
# App: http://localhost:8000

services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: plagiarism_checker
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  createbuckets:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      sleep 3;
      mc alias set local http://minio:9000 minioadmin minioadmin;
      mc mb -p local/plagiarism || true;
      exit 0;
      "

  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      ENV: production
      SECRET_KEY: change-me-in-docker-compose
      JWT_SECRET: change-me-in-docker-compose
      LEGACY_DATABASE_URL: mysql+pymysql://root:root@db:3306/plagiarism_checker?charset=utf8mb4
      DATABASE_URL: mysql+pymysql://root:root@db:3306/plagiarism_checker?charset=utf8mb4
      MYSQL_HOST: db
      MYSQL_PORT: 3306
      MYSQL_USER: root
      MYSQL_PASSWORD: root
      MYSQL_DATABASE: plagiarism_checker
      STORAGE_BACKEND: s3
      S3_BUCKET: plagiarism
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_REGION: us-east-1
      ACADEMIC_SEARCH: "1"
      WEB_SEARCH_REQUIRE_API: "0"
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_started
    volumes:
      - app_uploads:/app/uploads
      - app_data:/app/data

volumes:
  mysql_data:
  minio_data:
  app_uploads:
  app_data:
