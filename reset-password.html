<!DOCTYPE html>
<html lang="sq">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rivendos Fjalëkalimin — AAB</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root { --red:#C63F3F; --red3:#A52D2D; --cream:#FAF7F2; --text:#2D0808; --muted:#8A6A6A; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      font-family: 'DM Sans', sans-serif; background: linear-gradient(145deg, #2D0808, #6B1414);
      padding: 24px;
    }
    .card {
      width: 100%; max-width: 440px; background: var(--cream); border-radius: 16px;
      padding: 36px 32px; box-shadow: 0 24px 60px rgba(0,0,0,.35);
    }
    .mark {
      width: 44px; height: 44px; border-radius: 10px;
      background: linear-gradient(135deg, var(--red), var(--red3));
      color: #fff; display: flex; align-items: center; justify-content: center;
      font-family: 'Cormorant Garamond', serif; font-size: 22px; font-weight: 600; margin-bottom: 18px;
    }
    h1 { font-family: 'Cormorant Garamond', serif; font-size: 28px; font-weight: 600; color: var(--text); margin-bottom: 8px; }
    p.sub { font-size: 14px; color: var(--muted); line-height: 1.55; margin-bottom: 24px; }
    label { display: block; font-size: 12px; font-weight: 500; color: var(--muted); margin-bottom: 6px; text-transform: uppercase; letter-spacing: .04em; }
    input {
      width: 100%; padding: 12px 14px; border: 1px solid rgba(198,63,63,.22); border-radius: 8px;
      font-family: inherit; font-size: 14px; margin-bottom: 16px;
    }
    input:focus { outline: none; border-color: var(--red); box-shadow: 0 0 0 3px rgba(198,63,63,.12); }
    button {
      width: 100%; padding: 13px; border: none; border-radius: 8px; cursor: pointer;
      background: linear-gradient(135deg, var(--red), var(--red3)); color: #fff;
      font-family: inherit; font-size: 14px; font-weight: 600;
    }
    button:disabled { opacity: .65; cursor: wait; }
    .msg { font-size: 13px; margin-bottom: 14px; padding: 10px 12px; border-radius: 8px; display: none; }
    .msg.err { background: #fdeaea; color: #a52d2d; }
    .msg.ok { background: #e8f5e9; color: #2d7a3a; }
    .back { display: inline-block; margin-top: 18px; font-size: 13px; color: var(--red); text-decoration: none; }
    .back:hover { text-decoration: underline; }
    #state-invalid { display: none; text-align: center; }
  </style>
</head>
<body>
  <div class="card">
    <div id="state-form">
      <div class="mark">A</div>
      <h1>Fjalëkalim i ri</h1>
      <p class="sub">Vendos fjalëkalimin e ri për llogarinë tënde. Lidhja vlen 60 minuta.</p>
      <div id="msg" class="msg"></div>
      <label>Fjalëkalimi i ri</label>
      <input type="password" id="pw1" placeholder="Min. 8 karaktere" autocomplete="new-password">
      <label>Përsërit fjalëkalimin</label>
      <input type="password" id="pw2" placeholder="Përsërit" autocomplete="new-password" onkeydown="if(event.key==='Enter')submitReset()">
      <button type="button" id="btn" onclick="submitReset()">Ruaj fjalëkalimin</button>
      <a class="back" href="ballina.html">← Kthehu te hyrja</a>
    </div>
    <div id="state-invalid">
      <div class="mark">A</div>
      <h1>Lidhja skadoi</h1>
      <p class="sub">Lidhja e rivendosjes është e pavlefshme ose ka skaduar. Kërko një email të ri.</p>
      <a class="back" href="ballina.html" style="margin-top:0">Kthehu te hyrja</a>
    </div>
  </div>
<script>
  const API = (() => {
    const o = window.location.origin;
    if (o && o !== 'null' && !o.startsWith('file:') && /:8000$/.test(o)) return o + '/api';
    return 'http://127.0.0.1:8000/api';
  })();

  const params = new URLSearchParams(window.location.search);
  const TOKEN = params.get('token') || '';

  function showMsg(text, type) {
    const el = document.getElementById('msg');
    el.textContent = text;
    el.className = 'msg ' + type;
    el.style.display = 'block';
  }

  async function validateToken() {
    if (!TOKEN) {
      document.getElementById('state-form').style.display = 'none';
      document.getElementById('state-invalid').style.display = 'block';
      return;
    }
    try {
      const r = await fetch(API + '/auth/reset-password/validate?token=' + encodeURIComponent(TOKEN));
      if (!r.ok) {
        document.getElementById('state-form').style.display = 'none';
        document.getElementById('state-invalid').style.display = 'block';
      }
    } catch {
      showMsg('Nuk u lidh me serverin.', 'err');
    }
  }

  async function submitReset() {
    const pw1 = document.getElementById('pw1').value;
    const pw2 = document.getElementById('pw2').value;
    const btn = document.getElementById('btn');
    if (pw1.length < 8) return showMsg('Fjalëkalimi duhet min. 8 karaktere.', 'err');
    if (pw1 !== pw2) return showMsg('Fjalëkalimet nuk përputhen.', 'err');
    btn.disabled = true;
    btn.textContent = 'Duke ruajtur...';
    try {
      const r = await fetch(API + '/auth/reset-password', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ token: TOKEN, new_password: pw1 }),
      });
      const d = await r.json().catch(() => ({}));
      if (!r.ok) {
        showMsg(typeof d.detail === 'string' ? d.detail : 'Rivendosja dështoi.', 'err');
        return;
      }
      showMsg(d.message || 'Fjalëkalimi u ndryshua. Po të ridrejtojmë...', 'ok');
      setTimeout(() => { window.location.href = 'ballina.html'; }, 2200);
    } catch {
      showMsg('Nuk u lidh me serverin.', 'err');
    } finally {
      btn.disabled = false;
      btn.textContent = 'Ruaj fjalëkalimin';
    }
  }

  validateToken();
</script>
</body>
</html>
